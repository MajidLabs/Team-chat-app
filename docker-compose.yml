services:
  postgres:
    image: postgres:16-alpine
    container_name: teamchat-postgres
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
      POSTGRES_DB: teamchat
    # Standard host port. If you also run Postgres locally (outside Docker)
    # on its default 5432, `docker compose up` will fail to bind this port -
    # change the host side (e.g. "5433:5432") if that happens.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d teamchat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teamchat-redis
    # Host side deliberately isn't the default 6379, so this doesn't collide
    # with a Redis already running on the machine outside Docker. The
    # backend always talks to "redis:6379" on Docker's internal network
    # (below), so this mapping only matters if you want to reach this
    # container's Redis from the host yourself (e.g. redis-cli -p 6380).
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: teamchat-backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://chatuser:chatpass@postgres:5432/teamchat
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev_access_secret_change_me
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_ORIGIN: "*"
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE_MB: 10
      RATE_LIMIT_MESSAGES_PER_MIN: 30
      RATE_LIMIT_LOGIN_PER_15MIN: 10
      RATE_LIMIT_UPLOADS_PER_MIN: 20
      RATE_LIMIT_GENERAL_PER_15MIN: 300
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
